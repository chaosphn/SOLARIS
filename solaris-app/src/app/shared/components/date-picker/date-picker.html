<div class="h-100 bz date-picker-container" [style.scale]="scale" [style.translate]="((1-scale)*100) + 'px 0'">
    @switch (type) {
        @case ('month') {
            <mat-form-field class="date-field">
                <input
                    matInput
                    [matDatepicker]="monthPicker"
                    [(ngModel)]="selectedDate"
                    [max]="maxDate"
                    [id]="uniqueId"
                    readonly
                />
                <mat-datepicker-toggle matIconSuffix [for]="monthPicker"></mat-datepicker-toggle>
                <mat-datepicker 
                    #monthPicker 
                    startView="multi-year"
                    (monthSelected)="onMonthSelected($event, monthPicker)"
                    panelClass="custom-datepicker-panel"
                ></mat-datepicker>
            </mat-form-field>
        }
        @case ('year') {
            <mat-form-field class="date-field">
                <input
                    matInput
                    [matDatepicker]="yearPicker"
                    [(ngModel)]="selectedDate"
                    [max]="maxDate"
                    [id]="uniqueId"
                    readonly
                />
                <mat-datepicker-toggle matIconSuffix [for]="yearPicker"></mat-datepicker-toggle>
                <mat-datepicker 
                    #yearPicker 
                    startView="multi-year"
                    (yearSelected)="onYearSelected($event, yearPicker)"
                    panelClass="custom-datepicker-panel"
                ></mat-datepicker>
            </mat-form-field>
        }
        @case ('datetime') {
            <div class="datetime-wrap">
                <mat-form-field class="date-field" [style.--custom-height]="height + 'px'">
                    <input
                        matInput
                        [matDatepicker]="datetimePicker"
                        [(ngModel)]="selectedDate"
                        (dateChange)="onDateSelect($event)"
                        [max]="maxDate"
                        [id]="uniqueId"
                        readonly
                    />
                    <mat-datepicker-toggle matIconSuffix [for]="datetimePicker"></mat-datepicker-toggle>
                    <mat-datepicker
                        #datetimePicker
                        panelClass="custom-datepicker-panel"
                    ></mat-datepicker>
                </mat-form-field>
                <input
                    type="time"
                    class="time-input"
                    [id]="uniqueId + '-time'"
                    [value]="selectedTime"
                    (change)="onTimeChange($event)"
                />
            </div>
        }
        @default {
            <mat-form-field class="date-field" [style.--custom-height]="height + 'px'">
                <input
                    matInput
                    [matDatepicker]="dayPicker"
                    [(ngModel)]="selectedDate"
                    (dateChange)="onDateSelect($event)"
                    [max]="maxDate"
                    [id]="uniqueId"
                    readonly
                />
                <mat-datepicker-toggle matIconSuffix [for]="dayPicker"></mat-datepicker-toggle>
                <mat-datepicker
                    #dayPicker
                    panelClass="custom-datepicker-panel"
                ></mat-datepicker>
            </mat-form-field>
        }
    }
</div>
