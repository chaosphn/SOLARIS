<div class="container w-100 bz">
    <div class="summaryCard bz w-100 h-100">
        <app-summary-card
            [today_curr]="dataRealtime()['TODAY'] || {}"
            [today_prev]="dataRealtime()['YESTERDAY'] || {}"
            [month_curr]="dataRealtime()['MONTHLY'] || {}"
            [month_prev]="dataRealtime()['WH_TARGET'] || {}"
            [pr_curr]="dataRealtime()['PR'] || {}"
            [pr_prev]="dataRealtime()['PR_TARGET'] || {}"
            [avai_curr]="dataRealtime()['AVAI'] || {}"
            [avai_prev]="dataRealtime()['AVAI_TARGET'] || {}"
            [revenue_curr]="dataRealtime()['REVENUE'] || {}"
            [revenue_prev]="dataRealtime()['REVENUE_YTD'] || {}"
            [co2_curr]="dataRealtime()['REDUCTION'] || {}"
            [co2_prev]="dataRealtime()['REDUCTION_TOT'] || {}"
        ></app-summary-card>
    </div>
    <div class="powerCard bz w-100 h-100">
        <app-card-container [title]="'ENERGY CONSUMPTION'">
            <ng-template #container>
                <app-power-consumsion
                    [energy]="dataRealtime()['TODAY'] || {}"
                    [expected]="dataRealtime()['TODAY_EXPRECTD'] || {}"
                    [power]="dataRealtime()['POWER'] || {}"
                    [yield]="dataRealtime()['YIELD'] || {}"
                    [performance]="dataRealtime()['PEAK'] || {}"
                    [capacity]="dataRealtime()['CAPACITY'] || {}"
                ></app-power-consumsion>
            </ng-template>
        </app-card-container>
    </div>
    <div class="energyCard bz w-100 h-100">
        <app-card-container [title]="'Energy production'" [expandable]="true">
            <ng-template #container>
                <!-- <div class="w-100 h-100">
                    <app-energy-consumption
                        [today]="dataRealtime()['TODAY'] || {}"
                        [month]="dataRealtime()['MONTHLY'] || {}"
                        [year]="dataRealtime()['YEARLY'] || {}"
                        [total]="dataRealtime()['TOTAL'] || {}"
                        [chartData]="dataChart()['CHART01']"
                    ></app-energy-consumption>
                </div> -->
                <div class="chart-box w-100 h-100 bz" style="max-height: 95%; margin-top: 2%;">
                    @if (dataChart() && dataChart()['CHART02']) {
                        <app-highchart [chartParameter]="dataChart()['CHART02']"></app-highchart>
                    }
                </div>
            </ng-template>
        </app-card-container>
    </div>
    <div class="environmentCard bz w-100 h-100">
        <app-card-container [title]="'Sustainability'">
            <ng-template #container>
                <app-environment-card
                    [reduction]="dataRealtime()['REDUCTION_TOT'] || {}"
                    [credit]="dataRealtime()['CREDIT'] || {}"
                    [tree]="dataRealtime()['TREE'] || {}"
                    [oil]="dataRealtime()['OIL'] || {}"
                ></app-environment-card>
            </ng-template>
        </app-card-container>
    </div>
    <div class="statusCard bz w-100 h-100">
        <app-card-container [title]="'PR & AVAILABILITY'" [expandable]="true">
            <ng-template #container>
                <!-- <div class="w-100 h-100 d-flex-ct">
                    <app-piechart [vertical]="false" [statusData]="plantStatusData()"></app-piechart>
                </div> -->
                <div class="chart-box w-100 h-100 bz" style="max-height: 95%; margin-top: 2%;">
                    @if (dataChart() && dataChart()['CHART03']) {
                        <app-highchart [chartParameter]="dataChart()['CHART03']"></app-highchart>
                    }
                </div>
            </ng-template>
        </app-card-container>
    </div>
    <div class="produceCard bz w-100 h-100">
        <app-card-container [title]="'FINANCIAL SUMMARY'">
            <ng-template #container>
                <!-- <div class="chart-box w-100 h-100 bz" style="max-height: 90%; margin-top: 5%;">
                    @if (dataChart() && dataChart()['CHART02']) {
                        <app-highchart [chartParameter]="dataChart()['CHART02']"></app-highchart>
                    }
                </div> -->
                <app-financial-summary
                    [today]="dataRealtime()['REVENUE_MONTH'] || {}"
                    [month]="dataRealtime()['REVENUE_YEAR'] || {}"
                    [target]="dataRealtime()['WH_TARGET'] || {}"
                    [month_wh]="dataRealtime()['YEARLY']"
                    [tariff]="(dataRealtime()['REVENUE_MONTH']?.Value ?? 0)/(dataRealtime()['MONTHLY']?.Value ?? 1)"
                ></app-financial-summary>
            </ng-template>
        </app-card-container>
    </div>
    <div class="sitesCard bz w-100 h-100">
        <app-card-container [title]="'plant GENERATION'">
            <ng-template #container>
                @if (siteList()) {
                    <div class="site-card w-100 h-100 bz" >
                        @for (item of siteList(); track $index) {
                            <div class="content bz h-100">
                                <app-stack-chart
                                    [value]="dataRealtime()[item.id + '_POWER']?.Value?.toString() || '0'"
                                    [maxVal]="dataRealtime()[item.id + '_POWER']?.Max || 100"
                                    [unit]="dataRealtime()[item.id + '_POWER']?.Unit || 'kW'"
                                    [activeColor]="'#D6AA19'"
                                    [bgColor]="'var(--stack-bg)'"
                                    [bdRadius]="'2px'"
                                    [rangeVal]="10"
                                    [label]="item.id"
                                    [legend]="false"
                                    [verLabel]="true"
                                    [height]="65"
                                ></app-stack-chart>
                                
                            </div>
                        }
                    </div>
                }
            </ng-template>
        </app-card-container>
    </div>
    <div class="layoutCard bz w-100 h-100">
        <app-card-container [title]="'Map OVERVIEW'">
            <ng-template #container>
                <!-- <app-map-consumption 
                    [zone]="zoneSelected()"
                    [config]="mapConfig()"
                    [sites]="siteList()"
                    (selectZone)="onZoneChanges($event)"
                    >
                </app-map-consumption> -->
                <app-map-container [dataRealtime]="dataRealtime()" [siteList]="siteList()"></app-map-container>
            </ng-template>
        </app-card-container>
    </div>
</div>
