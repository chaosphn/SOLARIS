<div class="container w-100 h-100 bz">
    @if (data() && property()[0]) {
        <div class="chart-box w-100 bz">
            @if (inverter().length > 0) {
                <app-highchart [chartParameter]="chart()"></app-highchart>
            } @else {
                <app-no-data [message]="'No Inverter'"></app-no-data>
            }
        </div>
        <div class="grade-card">
            <div class="grade-ranges">
                @for (color of property(); track $index) {
                    <div class="grade-range" [style.background-color]="selectedInverter().prefix == color.prefix ? color.activeColor : color.bgColor" (click)="changeMode(color)">
                        <span class="range-text">{{ color.title }}</span>
                    </div>
                }
            </div>
        </div>
    }
</div>
