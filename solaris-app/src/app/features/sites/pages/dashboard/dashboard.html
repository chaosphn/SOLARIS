<div class="w-100 h-100 container bz">
    <div class="infoCard bz">
        <app-card-container [title]="'PLANT INFOMATION'">
            <ng-template #container>
                <app-infomation-card
                    [site]="siteInfomation().name"
                    [location]="siteInfomation().location"
                    [capacity]="siteInfomation().capacity + ' MWp'"
                    [capacity_dc]="siteInfomation().capacity_dc + ' MWp'"
                    [cod]="siteInfomation().cod"
                ></app-infomation-card>
            </ng-template>
        </app-card-container>
    </div>
    <div class="powerCard bz">
        <app-card-container [title]="'POWER GENERATION'">
            <ng-template #container>
               <app-power-consumption
                    [title]="'PR'"
                    [value]="(dataRealtime()['PR']?.Value | number: '1.0-0') ?? ''"
                    [unit]="'%'"
                    [percent]="dataRealtime()['PR']"

                    [title1]="'ACTIVE POWER'"
                    [value1]="(dataRealtime()['POWER']?.Value | number: '1.0-0') ?? ''"
                    [unit1]="'kW'"

                    [title2]="'TODAY YIELD'"
                    [value2]="(dataRealtime()['YIELD']?.Value | number: '1.0-2') ?? ''"
                    [unit2]="'kWp/kWh'"
               ></app-power-consumption>
            </ng-template>
        </app-card-container>
    </div>
    <div class="produceCard bz">
        <app-card-container [title]="'ENERGY PRODUCTION'">
            <ng-template #container>
                <app-power-consumption
                    [title]="'PRODUCE'"
                    [value]="(dataRealtime()['TODAY']?.Value | number: '1.0-0') ?? ''"
                    [unit]="dataRealtime()['TODAY']?.Unit || ''"
                    [percent]="dataRealtime()['TODAY']"

                    [title1]="'MONTHLY ENERGY'"
                    [value1]="((dataRealtime()['MONTHLY']?.Value/1000) | number: '1.0-0') ?? ''"
                    [unit1]="'MWh'"

                    [title2]="'YEARLY ENERGY'"
                    [value2]="((dataRealtime()['YEARLY']?.Value/1000) | number: '1.0-1') ?? ''"
                    [unit2]="'MWh'"
            ></app-power-consumption>
            </ng-template>
        </app-card-container>
    </div>
    <div class="weatherCard bz">
        <app-card-container [title]="'WEATHER STATION'">
            <ng-template #container>
                <app-weather-station
                    [icon1]="'solar_power'"
                    [data1]="dataRealtime()['PVTEMP']"
                    [color1]="'#E3A92B'"

                    [icon2]="'thermostat'"
                    [data2]="dataRealtime()['AMBTEMP']"
                    [color2]="'#FF4560'"

                    [icon3]="'air'"
                    [data3]="dataRealtime()['WIND']"
                    [color3]="'#38649F'"

                    [icon4]="'co2'"
                    [data4]="dataRealtime()['REDUCTION']"
                    [color4]="'#34C08A'"

                    [title1]="'IRRADIATION'"
                    [value1]="dataRealtime()['PYRANO']"
                    [unit1]="'W/m²'"

                    [title2]="'INSOLUTION'"
                    [value2]="dataRealtime()['INSOLUTION']"
                    [unit2]="'kWh/m²'"
                ></app-weather-station>
            </ng-template>
        </app-card-container>
    </div>
    <div class="solarCard bz">
        <app-card-container [title]="'SOLAR PROFILE'" [expandable]="true">
            <ng-template #container>
               <app-chart-card
                [name]="'CHART01'"
                [isLoading]="loadingChart()"
                [chartData]="dataChart()['CHART01']"
                (dateChange)="onChartUpdate($event)"
               >
               </app-chart-card>
            </ng-template>
        </app-card-container>
    </div>
    <div class="energyCard bz">
        <app-card-container [title]="'ENERGY SUMMARY'" [expandable]="true">
            <ng-template #container>
                <app-chart-card
                    [name]="'CHART02'"
                    [isLoading]="loadingChart()"
                    [chartData]="dataChart()['CHART02']"
                    (dateChange)="onChartUpdate($event)"
                >
                </app-chart-card>
            </ng-template>
        </app-card-container>
    </div>
    <div class="inverterCard bz">
        <app-card-container [title]="'INVERTER EVALUATION'" [expandable]="true">
            <ng-template #container>
                <app-inverter-summary
                    [data]="dataRealtime()"
                    [property]="cardProperty()"
                    [inverter]="inverterList()"
                >
                </app-inverter-summary>
            </ng-template>
        </app-card-container>
    </div>
</div>
