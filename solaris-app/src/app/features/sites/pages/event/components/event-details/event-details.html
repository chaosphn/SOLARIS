<div class="container w-100 h-100 bz">

    <div class="card-box w-100 bz">
        <div class="title w-100">EQUIPMENT</div>
        <div class="value bz w-100">{{ event().equipment || '---' }}</div>
    </div>

    <div class="card-box w-100 bz">
        <div class="title w-100">ASSET</div>
        <div class="value bz w-100">{{ event().asset || '---' }}</div>
    </div>
    
    <div class="card-box w-100 bz">
        <div class="title w-100">TIMESTAMP</div>
        <div class="value bz w-100">{{ event().timestamp || '---' }}</div>
    </div>

    <div class="card-box w-100 bz">
        <div class="title w-100">MESSAGE</div>
        <div class="value bz w-100">{{ event().message || '---' }}</div>
    </div>

    <div class="card-box w-100 bz">
        <div class="title w-100">CONDITION</div>
        <div class="value bz w-100">{{"STX01.CALC.INSOLATION > 1000 AND STX01.CALC.CAPACITY < 10 "}}</div>
    </div>

</div>
